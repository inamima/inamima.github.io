<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>inamima - Portfolio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      background-color: #f5f7f4;
      color: #2f3e2f;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
      overflow: hidden;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 0.2em;
    }

    .tagline {
      font-size: 1.2rem;
      color: #4b6043;
      font-weight: 500;
      margin-bottom: 1em;
    }

    .links {
      display: flex;
      gap: 20px;
      margin-top: 1em;
      flex-wrap: wrap;
      justify-content: center;
    }

    .links a {
      text-decoration: none;
      color: #2f3e2f;
      border: 2px solid #4b6043;
      padding: 10px 20px;
      border-radius: 30px;
      transition: all 0.3s ease;
      font-weight: bold;
    }

    .links a:hover {
      background-color: #2f4731;
      color: #fff;
    }

    .dropdown {
      margin-top: 2em;
    }

    .dropdown button {
      background-color: #4b6043;
      color: white;
      padding: 10px 20px;
      font-size: 1rem;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .dropdown button:hover {
      background-color: #2f4731;
    }

    .tool-links {
      overflow: hidden;
      max-height: 0;
      transition: max-height 0.5s ease;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 1em;
    }

    .tool-links.open {
      max-height: 500px; /* 十分大きく設定しておけばOK */
    }

    .tool-links a {
      text-decoration: none;
      color: #2f3e2f;
      border: 2px solid #4b6043;
      padding: 8px 16px;
      border-radius: 20px;
      transition: all 0.3s ease;
      font-weight: bold;
      background-color: #ffffff;
    }

    .tool-links a:hover {
      background-color: #2f4731;
      color: #fff;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 2rem;
      }

      .tagline {
        font-size: 1rem;
      }

      .links {
        flex-direction: column;
        gap: 15px;
      }

      .dropdown button {
        width: 100%;
      }

      .tool-links a {
        width: 80%;
        margin: 0 auto;
      }
    }
  </style>
  <script>
    function toggleDropdown() {
      const tools = document.getElementById("toolLinks");
      tools.classList.toggle("open");
    }
  </script>
</head>
<body>
  <h1>inamima</h1>
  <div class="tagline">Cloud Engineer</div>

  <div class="links">
    <a href="https://github.com/inamima" target="_blank">GitHub</a>
  </div>
</body>
</html>
